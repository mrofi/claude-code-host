name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats shellcheck rclone tmux jq git socat util-linux
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR scripts/*.sh tests/*.sh
      - name: bats
        run: bats tests/*.bats

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the base image
        run: docker build -t claude-host .
      - name: Smoke test (MinIO, stub claude, derived image)
        run: bash tests/smoke.sh claude-host
      - name: Layer scan
        run: bash tests/layer-scan.sh claude-host
